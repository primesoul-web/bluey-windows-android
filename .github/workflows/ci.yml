name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  protocol:
    name: Protocol conformance (fixtures + .NET tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate fixtures against the packet schema
        run: |
          pip install jsonschema==4.23.0
          python3 scripts/validate-fixtures.py

      - name: .NET protocol tests (codec, throttle, framer, server, LiveWire)
        run: dotnet test windows/tests/GooglyProtocol.Tests/GooglyProtocol.Tests.csproj --logger "console;verbosity=normal"

  windows:
    name: Windows host (EXE)
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Build A — framework-dependent folder (small; needs the .NET 10 Desktop
      # Runtime; the profile proven to run on the user's PC).
      - name: Build (framework-dependent)
        run: dotnet publish windows/src/GooglyWindows/GooglyWindows.csproj -c Release -r win-x64 --self-contained false -o artifacts/framework

      # Build B — self-contained single-file (no runtime needed; Windows-built,
      # unlike the Linux cross-build that SmartScreen/AV flag).
      - name: Build (self-contained single file)
        run: dotnet publish windows/src/GooglyWindows/GooglyWindows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/selfcontained

      - name: Zip both builds
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/framework/* -DestinationPath artifacts/Bluey-windows-framework.zip
          Compress-Archive -Path artifacts/selfcontained/* -DestinationPath artifacts/Bluey-windows-selfcontained.zip

      - name: Upload artifact (framework)
        uses: actions/upload-artifact@v4
        with:
          name: bluey-windows-framework
          path: artifacts/Bluey-windows-framework.zip
          if-no-files-found: error

      - name: Upload artifact (self-contained)
        uses: actions/upload-artifact@v4
        with:
          name: bluey-windows-selfcontained
          path: artifacts/Bluey-windows-selfcontained.zip
          if-no-files-found: error

  android:
    name: Android client (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK platform 35 + licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests (codec, framer, dispatcher, socket, binary frames)
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluey-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
